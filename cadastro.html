<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <link rel="stylesheet" href="style_1.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <h1>Criar conta</h1>

            <p class="subtitle">
                Preencha os dados abaixo
            </p>

            <form id="cadastroForm">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Seu nome"
                    required
                >

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Crie uma senha"
                    minlength="6"
                    required
                >

                <label for="confirmarSenha">
                    Confirmar senha
                </label>

                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Digite a senha novamente"
                    minlength="6"
                    required
                >

                <button type="submit">
                    Cadastrar
                </button>

            </form>

            <p class="link-text">
                Já possui uma conta?
                <a href="login.html">
                    Voltar para o login
                </a>
            </p>

            <p id="mensagem"></p>

        </section>

    </main>

   
    <script src="script.js"></script>

</body>

</html>
