<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
    <a href="#">Página Inicial</a>
    <a href="#">Bíblia</a>
    <a href="#">Produtos</a>
    <a href="#">Loja</a>
    <a href="#">Perfil</a>
    <a href="#">Sobre nós</a>
    <a href="#" aria-label="Carrinho">🛒</a>
    <a href="#">Login / Cadastro</a>
</header>

<main>
  <div class="auth-card">

    <div class="card-head">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21a8 8 0 0 0-16 0"/>
          <circle cx="12" cy="8" r="5"/>
          <path d="M19 8h2M20 7v2"/>
        </svg>
      </div>
      <div>
        <h1>Cadastro</h1>
        <p>Preencha os dados abaixo para criar sua conta.</p>
      </div>
    </div>

    <form>
      <div class="row">
        <div class="field">
          <label for="nome">Nome completo</label>
          <input id="nome" name="nome" type="text" placeholder="Seu nome completo" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="senha">Senha</label>
          <div class="input-wrap">
            <input id="senha" name="senha" type="password" placeholder="Crie uma senha segura" autocomplete="new-password" required>
            <button type="button" class="icon-btn" data-toggle="senha" aria-label="Mostrar senha">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="confirmar">Confirmar senha</label>
          <div class="input-wrap">
            <input id="confirmar" name="confirmar" type="password" placeholder="Confirme sua senha" autocomplete="new-password" required>
            <button type="button" class="icon-btn" data-toggle="confirmar" aria-label="Mostrar senha">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="nascimento">Data de nascimento <span class="optional">(opcional)</span></label>
        <div class="input-wrap">
          <input id="nascimento" name="nascimento" type="text" placeholder="dd / mm / aaaa" onfocus="(this.type='date')" onblur="if(!this.value)this.type='text'">
        </div>
      </div>

      <div class="field select-wrap">
        <label for="estado">Estado</label>
        <select id="estado" name="estado" required>
          <option value="" selected disabled>Selecione seu estado</option>
          <option>Acre</option><option>Alagoas</option><option>Amapá</option><option>Amazonas</option>
          <option>Bahia</option><option>Ceará</option><option>Distrito Federal</option><option>Espírito Santo</option>
          <option>Goiás</option><option>Maranhão</option><option>Mato Grosso</option><option>Mato Grosso do Sul</option>
          <option>Minas Gerais</option><option>Pará</option><option>Paraíba</option><option>Paraná</option>
          <option>Pernambuco</option><option>Piauí</option><option>Rio de Janeiro</option><option>Rio Grande do Norte</option>
          <option>Rio Grande do Sul</option><option>Rondônia</option><option>Roraima</option><option>Santa Catarina</option>
          <option>São Paulo</option><option>Sergipe</option><option>Tocantins</option>
        </select>
      </div>

      <label class="terms">
        <input type="checkbox" required>
        <span>Eu concordo com os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a>.</span>
      </label>

      <button type="submit" class="btn-primary">Criar conta</button>

      <div class="divider">ou</div>

      <div class="social-group">
        <button type="button" class="btn-social">
          <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.9 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.9 29.5 4 24 4c-7.7 0-14.4 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.1-1.8 13.8-5l-6.4-5.4C29.3 35.4 26.8 36 24 36c-5.3 0-9.7-3.1-11.3-7.6l-6.6 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.1 5.6l6.4 5.4C41.5 36.1 44 30.6 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
          Cadastrar com Google
        </button>
        <button type="button" class="btn-social">
          <svg viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07c0 6.03 4.39 11.03 10.13 11.93v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.95.93-1.95 1.89v2.25h3.32l-.53 3.49h-2.79v8.44C19.61 23.1 24 18.1 24 12.07Z"/></svg>
          Cadastrar com Facebook
        </button>
      </div>

      <p class="switch-link">Já tem uma conta? <a href="#">Entrar</a></p>
    </form>

  </div>
</main>

<script>
  document.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const input = document.getElementById(btn.dataset.toggle);
      input.type = input.type === 'password' ? 'text' : 'password';
    });
  });
</script>

</body>
</html>
