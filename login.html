<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="style_1.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <h1>Entrar</h1>

            <p class="subtitle">
                Acesse sua conta
            </p>

            <form id="loginForm">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

            </form>

            <p class="link-text">
                Ainda não possui uma conta?
                <a href="cadastro.html">
                    Criar conta
                </a>
            </p>

            <p id="mensagem"></p>

        </section>

    </main>

  
    <script src="script.js"></script>

</body>

</html>
